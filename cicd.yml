# 1. Give your workflow a name
name: Node.js CI

# 2. Define what events trigger the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch: 

# 3. Define the jobs to execute
jobs:
  build-and-test:
    # Choose the operating system runner
    runs-on: ubuntu-latest

    # Define the environment variables (optional)
    env:
      NODE_ENV: test

    # 4. Sequentially list the steps to execute inside the runner
    steps:
      # Step 1: Check out your repository's code onto the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically caches node_modules for faster subsequent runs

      # Step 3: Clean install your dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run your code linter (checks code style)
      - name: Run linter
        run: npm run lint

      # Step 5: Execute your automated tests
      - name: Run tests
        run: npm test
